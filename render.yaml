# Развёртывание на Render из корневого Dockerfile: один веб-сервис отдаёт API и собранный
# интерфейс с одного адреса (cookie-сессия и CSRF рассчитаны на один origin), worker — тот же образ.
# Конфигурация допускает только проверенный код доверенной команды (EXECUTION_MODE=trusted-local).
# Публичный доступ с пользовательским Python разворачивать через Docker Compose по README.
databases:
  - name: balance-platform-db
    plan: free
    databaseName: balance_db
    user: balance_user

services:
  # 1. API + интерфейс (Web Service, Docker)
  - type: web
    name: balance-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balance-platform-db
          property: connectionString
      # Адрес самого сервиса, например https://balance-app.onrender.com (без / в конце)
      - key: APP_PUBLIC_URL
        sync: false
      # Тот же адрес, что и APP_PUBLIC_URL
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"

  # 2. Background Worker (тот же образ). У Background Worker на Render нет бесплатного тарифа.
  - type: worker
    name: balance-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balance-platform-db
          property: connectionString
      - key: EXECUTION_MODE
        value: trusted-local
      - key: APP_PUBLIC_URL
        sync: false
      - key: AI_PROVIDER
        value: yandex
      - key: AI_FOLDER_ID
        sync: false
      - key: AI_API_KEY
        sync: false
