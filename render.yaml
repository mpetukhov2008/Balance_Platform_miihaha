# Эта конфигурация допускает только проверенный код доверенной команды.
# Публичный доступ с пользовательским Python разворачивать через Docker Compose по README.
databases:
  - name: balance-platform-db
    plan: free
    databaseName: balance_db
    user: balance_user

services:
  # 1. Backend API (Web Service)
  - type: web
    name: balance-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.lock.txt"
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balance-platform-db
          property: connectionString
      - key: APP_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /api/v1/health

  # 2. Background Worker (для обработки задач)
  # Важно: у Background Worker на Render нет бесплатного тарифа
  - type: worker
    name: balance-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r backend/requirements.lock.txt"
    startCommand: "python -m backend.worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balance-platform-db
          property: connectionString
      - key: EXECUTION_MODE
        value: trusted-local
      - key: AI_PROVIDER
        value: yandex
      - key: AI_FOLDER_ID
        sync: false
      - key: AI_API_KEY
        sync: false

  # 3. Frontend (Статический сайт)
  # У статических сайтов НЕТ поля plan, его нельзя указывать
  - type: web
    name: balance-frontend
    runtime: static
    buildCommand: "npm --prefix frontend ci && npm --prefix frontend run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: balance-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
