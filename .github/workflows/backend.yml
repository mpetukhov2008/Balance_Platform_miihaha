name: Backend
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest -q
        env:
          EXECUTION_MODE: trusted-local
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: balance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d balance_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest tests/test_queries.py tests/test_synthetic_api.py tests/test_security.py tests/test_dataset_upload.py -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test:test-only-ci@localhost:5432/balance_test

  docker-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: docker build -f infra/Runner.Dockerfile -t balance-runner:local .
      - run: python -m pytest tests/test_docker_runner.py -q
        env:
          RUN_DOCKER_TESTS: '1'
