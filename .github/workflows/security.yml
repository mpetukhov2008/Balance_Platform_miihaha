name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: python scripts/repository_checks.py
      - run: pip-audit -r backend/requirements.lock.txt --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix frontend audit --audit-level=moderate
