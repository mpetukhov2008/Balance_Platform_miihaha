name: Compose scenario
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'infra/**', 'compose.yaml', '.env.example', '.dockerignore', 'scripts/**', '.github/workflows/compose.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'infra/**', 'compose.yaml', '.env.example', '.dockerignore', 'scripts/**', '.github/workflows/compose.yml']
jobs:
  full-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      SCENARIO_PASSWORD: ci-only-scenario-password
      APP_PUBLIC_URL: http://localhost:8000
      ALLOW_REGISTRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: docker compose --profile tools build
      - run: docker compose up -d db api worker
      - name: Wait for API and create test accounts
        run: |
          python - <<'PY'
          import time
          import httpx
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  httpx.get("http://localhost:8000/api/v1/health", timeout=3).raise_for_status()
                  break
              except httpx.HTTPError:
                  time.sleep(1)
          else:
              raise RuntimeError("API unavailable")
          PY
          printf '%s\n' "$SCENARIO_PASSWORD" | docker compose exec -T api python -m backend.manage create-user scenario
          printf '%s\n' "$SCENARIO_PASSWORD" | docker compose exec -T api python -m backend.manage create-user other
      - name: Self-service registration against real API
        run: |
          python - <<'PY'
          import os
          import httpx
          with httpx.Client(base_url='http://localhost:8000/api/v1') as c:
              assert c.get('/auth/options').json()['registrationEnabled']
              body = {'username': 'self-service', 'password': os.environ['SCENARIO_PASSWORD']}
              assert c.post('/auth/register', json=body).status_code == 201
              assert c.post('/auth/register', json=body).status_code == 409
              assert c.post('/auth/login', json=body).status_code == 200
              assert c.get('/limits').json()['aiRequestsUsed'] == 0
              assert c.get('/runs').json()['total'] == 0
          PY
      - name: Upload private paired dataset through API
        id: upload
        run: |
          python - <<'PY'
          import io, os, zipfile
          from pathlib import Path
          import httpx
          output = io.BytesIO()
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as z:
              for side in ('BEFORE', 'AFTER'):
                  for path in sorted((Path('Исходники/samples') / side).glob('*.json')):
                      z.write(path, 'uploaded/' + side + '/' + path.name)
          with httpx.Client(base_url='http://localhost:8000/api/v1', timeout=60) as c:
              login = c.post('/auth/login', json={'username': 'scenario', 'password': os.environ['SCENARIO_PASSWORD']})
              login.raise_for_status()
              c.headers['X-CSRF-Token'] = login.json()['csrfToken']
              response = c.post('/datasets', params={'name': 'Uploaded samples'}, content=output.getvalue(), headers={'Content-Type': 'application/zip'})
              response.raise_for_status()
              dataset = response.json()
              assert dataset['kind'] == 'CUSTOM' and dataset['appCount'] == 4
          with httpx.Client(base_url='http://localhost:8000/api/v1') as c:
              c.post('/auth/login', json={'username': 'other', 'password': os.environ['SCENARIO_PASSWORD']}).raise_for_status()
              assert dataset['id'] not in [d['id'] for d in c.get('/datasets').json()['items']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('dataset_id=' + dataset['id'] + '\n')
          PY
      - name: Compare uploaded dataset with container worker
        run: python scripts/verify_scenario.py --username scenario --other-username other --dataset "${{ steps.upload.outputs.dataset_id }}" --output runtime/upload-scenario-verification.json
      - run: python scripts/verify_scenario.py --username scenario --other-username other --dataset full
      - name: Backup and restore into a separate database
        run: |
          docker compose run --rm backups --once
          docker compose run --rm --entrypoint sh backups -c 'cd /backups && sha256sum -c *.sha256'
          docker compose exec -T db createdb -U balance balance_restore
          docker compose run --rm --entrypoint sh backups -c 'pg_restore --exit-on-error --no-owner --no-acl -d balance_restore "$(ls -t /backups/balance-*.dump | head -n 1)"'
          test "$(docker compose exec -T db psql -U balance -d balance -tAc 'SELECT count(*) FROM records')" = "$(docker compose exec -T db psql -U balance -d balance_restore -tAc 'SELECT count(*) FROM records')"
          test "$(docker compose exec -T db psql -U balance -d balance -tAc 'SELECT count(*) FROM objects')" = "$(docker compose exec -T db psql -U balance -d balance_restore -tAc 'SELECT count(*) FROM objects')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-scenario-result
          path: runtime/*scenario-verification.json
          if-no-files-found: ignore
      - run: |
          docker compose logs --tail 150 api worker
          docker compose exec -T db psql -U balance -d balance -c "SELECT pid, wait_event_type, wait_event, state, left(query, 2000) FROM pg_stat_activity WHERE datname = 'balance';"
        if: failure()
      - run: docker compose down
        if: always()
