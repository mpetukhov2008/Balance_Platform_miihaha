name: balance-platform
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: balance
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U balance -d balance]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://balance:${POSTGRES_PASSWORD}@db/balance
      SOURCE_ROOT: /app/Исходники
      FULL_DATA_ROOT: /datasets
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      PUBLIC_DATASET_IDS: ${PUBLIC_DATASET_IDS:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-600}
      USER_REQUESTS_PER_MINUTE: ${USER_REQUESTS_PER_MINUTE:-600}
      LOGIN_ATTEMPTS_PER_15_MIN: ${LOGIN_ATTEMPTS_PER_15_MIN:-20}
      LOGIN_ATTEMPTS_GLOBAL_PER_MIN: ${LOGIN_ATTEMPTS_GLOBAL_PER_MIN:-60}
      REGISTRATIONS_PER_IP_HOUR: ${REGISTRATIONS_PER_IP_HOUR:-3}
      REGISTRATIONS_PER_DAY: ${REGISTRATIONS_PER_DAY:-100}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-50}
      MAX_PENDING_JOBS_PER_USER: ${MAX_PENDING_JOBS_PER_USER:-2}
      MAX_RUNS_PER_USER: ${MAX_RUNS_PER_USER:-10}
      COMPUTE_JOBS_PER_USER_HOUR: ${COMPUTE_JOBS_PER_USER_HOUR:-30}
      AI_REQUESTS_PER_USER_DAY: ${AI_REQUESTS_PER_USER_DAY:-10}
      AI_REQUESTS_GLOBAL_DAY: ${AI_REQUESTS_GLOBAL_DAY:-50}
      AI_TOKENS_PER_USER_DAY: ${AI_TOKENS_PER_USER_DAY:-30000}
      AI_TOKENS_GLOBAL_DAY: ${AI_TOKENS_GLOBAL_DAY:-200000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-20000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      CHECK_OUTPUT_LIMIT: ${CHECK_OUTPUT_LIMIT:-8388608}
      EXECUTION_MODE: docker
      RUNNER_IMAGE: balance-runner:local
      SCRIPT_TIMEOUT: ${SCRIPT_TIMEOUT:-180}
      AI_API_URL: ${AI_API_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_FOLDER_ID: ${AI_FOLDER_ID:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ${DATA_DIR:-./Исходники/data/RUN-20260827-0001/RESULTS}:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: [python, -m, backend.worker]
    environment: *app-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./Исходники/data/RUN-20260827-0001/RESULTS}:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
  backups:
    build:
      context: .
      dockerfile: infra/Backup.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      PGHOST: db
      PGDATABASE: balance
      PGUSER: balance
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ${BACKUP_DIR:-./runtime/backups/postgres}:/backups
    depends_on:
      db:
        condition: service_healthy
  runner:
    profiles: [tools]
    image: balance-runner:local
    build:
      context: .
      dockerfile: infra/Runner.Dockerfile
volumes:
  postgres-data:
