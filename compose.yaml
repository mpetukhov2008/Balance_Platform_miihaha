name: balance-platform
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: balance
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U balance -d balance]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://balance:${POSTGRES_PASSWORD}@db/balance
      SOURCE_ROOT: /app/Исходники
      FULL_DATA_ROOT: /datasets
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EXECUTION_MODE: docker
      RUNNER_IMAGE: balance-runner:local
      AI_API_URL: ${AI_API_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_FOLDER_ID: ${AI_FOLDER_ID:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ${DATA_DIR:-./Исходники/data/RUN-20260827-0001/RESULTS}:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: [python, -m, backend.worker]
    environment: *app-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./Исходники/data/RUN-20260827-0001/RESULTS}:/datasets:ro
    depends_on:
      db:
        condition: service_healthy
  runner:
    profiles: [tools]
    image: balance-runner:local
    build:
      context: .
      dockerfile: infra/Runner.Dockerfile
volumes:
  postgres-data:
